<!-- Source artwork for the generated PNG app icons (apple-touch-icon.png,
     icon-192.png, icon-512.png). Deliberately square with no corner radius:
     iOS and Android apply their own mask, and baking one in here produces a
     double-rounded icon. Regenerate the PNGs from this file after editing. -->
