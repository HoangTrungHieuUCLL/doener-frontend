    <path d="M13.2 16.2q2.8 1.2 5.6 0M12.2 19.6q3.8 1.5 7.6 0" stroke="#141414" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <rect x="15.1" y="4.5" width="1.8" height="22.5" rx="0.9" fill="#FFFBEA"/>
    <rect x="12.5" y="4.5" width="7" height="1.8" rx="0.9" fill="#FFFBEA"/>
