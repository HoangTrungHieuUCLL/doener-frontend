server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache, immutable (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Not every nginx build maps .webmanifest, and browsers are stricter about
    # this one than about most types.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Home-screen icons are served unfingerprinted from the root, so they get a
    # short cache rather than the immutable one used for /assets/.
    location ~* ^/(apple-touch-icon|icon-192|icon-512|icon|favicon)\.(png|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback: let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
